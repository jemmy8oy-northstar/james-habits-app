server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /james-habits-app {
        return 301 /james-habits-app/;
    }

    location /james-habits-app/ {
        try_files $uri /james-habits-app/index.html;
    }

    # Optional: cache static files aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
